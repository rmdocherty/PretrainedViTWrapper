[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PretrainedViTWrapper"
version = "0.0.3"
authors = [
  { name="Ronan Docherty", email="ronan.docherty18@imperial.ac.uk"},
]
description = "Wrapper for pretrained ViTs"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "torch>=2.0.0",
  "torchvision>=0.25.0",
  "timm>=1.0.27",
  "pillow>=12.0.0",
  "torchmetrics",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "matplotlib"
]
models = [
  "torchmetrics",
  "termcolor"
]

[project.urls]
"Homepage" = "https://github.com/rmdocherty/PretrainedViTWrapper"
"Bug Tracker" = "https://github.com/rmdocherty/PretrainedViTWrapper"

[tool.setuptools]
packages = ["PVW",]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true          # everything else comes from PyPI

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true         # only packages explicitly pinned to this index

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]
